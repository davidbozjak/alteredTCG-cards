
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Thursday, 2026-10-22</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Thursday, 2026-10-22</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="clues">
    <h3>Clues</h3>
    <ul id="clueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, null, null, null, null, null, "10", "9", null, ],
		[null, null, null, null, null, "4", null, "t", "u", null, ],
		[null, null, "3", "7", "i", "d", null, "o", "m", null, ],
		[null, "2", "s", "8", "l", "i", "n", "n", "e", null, ],
		[null, "t", "u", "5", "t", "a", "k", null, "å", null, ],
		[null, "y", "d", null, null, "m", null, null, null, null, ],
		["1", "s", "o", "m", "m", "a", "r", null, null, null, ],
		[null, "k", "k", "6", "o", "n", "d", null, null, null, ],
		[null, null, "u", "11", "y", "t", "a", "n", null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
clues: [{ number: 1, clue: "Varmaste årstiden" }, 
{ number: 2, clue: "Från Tyskland" }, 
{ number: 3, clue: "Hapanskt sifferpussel" }, 
{ number: 4, clue: "Mycket hård ädelsten" }, 
{ number: 5, clue: "Överst på huset" }, 
{ number: 6, clue: "Motsats till god" }, 
{ number: 7, clue: "Kort med ditt namn" }, 
{ number: 8, clue: "Svensk naturforskare Carl von" }, 
{ number: 9, clue: "Universitetsstad norr om Stockholm" }, 
{ number: 10, clue: "Tusen kilo" }, 
{ number: 11, clue: "överst på vattnet" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const clueList = document.getElementById("clueList");
crossword.clues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    clueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value.toUpperCase() === correct) {
            input.classList.remove("incorrect");
            input.classList.add("correct");
        } else {
            input.classList.remove("correct");
            input.classList.add("incorrect");
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
