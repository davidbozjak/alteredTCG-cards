
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Monday, 2026-10-26</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Monday, 2026-10-26</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="clues">
    <h3>Horizotnal</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Vertical</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, null, "2", null, null, null, "12", null, null, ],
		["11", "b", "e", "b", "i", "s", "14", "m", "10", null, ],
		["1", "f", "i", "l", "4", null, "t", "o", "b", null, ],
		[null, "7", "8", "a", "m", "p", "e", "r", "e", null, ],
		["6", "s", "u", "d", "a", "n", null, "s", "n", null, ],
		[null, "p", "3", "e", "c", "h", "o", null, null, null, ],
		[null, "a", null, "9", "k", "n", "i", "v", null, null, ],
		[null, "d", "5", "h", "a", "y", "e", "k", null, null, ],
		["13", "e", "k", null, null, null, null, null, null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "jämnar ut metall" }, 
{ number: 3, clue: "marvelhjältinna som imiterar" }, 
{ number: 5, clue: "nobelpristagare inom ekonomi" }, 
{ number: 6, clue: "stort afrikanskt land" }, 
{ number: 8, clue: "strömenhet" }, 
{ number: 9, clue: "skär maten" }, 
{ number: 11, clue: "Mycket litet barn" }, 
{ number: 13, clue: "lövträd med ekollon" }, 
],  
verticalClues: [
{ number: 2, clue: "marvelhjälte som jagar vampyrer" }, 
{ number: 4, clue: "brödskiva med pålägg" }, 
{ number: 7, clue: "gräver jord" }, 
{ number: 10, clue: "kroppsdel" }, 
{ number: 12, clue: "dödens personifikation" }, 
{ number: 14, clue: "varm dryck" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
