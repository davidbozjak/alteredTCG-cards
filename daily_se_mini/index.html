
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Wednesday, 2026-10-28</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Wednesday, 2026-10-28</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="clues">
    <h3>Horizotnal</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Vertical</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, "10", null, "3", null, "19", "20", "17", null, null, ],
		["13", "s", "2", "l", "6", "o", "b", "s", "22", null, ],
		[null, "o", "b", "i", "f", "d", null, "t", "l", null, ],
		[null, "y", "l", "t", "r", "i", null, "r", "u", null, ],
		[null, "u", "u", "a", "y", "n", "7", "e", "k", null, ],
		["1", "z", "e", "u", "s", "5", "f", "a", "e", null, ],
		[null, "12", "8", "e", "14", "a", "r", "m", null, null, ],
		["4", "r", "u", "n", "w", "a", "y", "11", null, null, ],
		[null, null, null, null, "9", "a", "s", "k", null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "gudarnas kung" }, 
{ number: 4, clue: "ai för videoeffekter" }, 
{ number: 8, clue: "vokalernas arbetshäst" }, 
{ number: 9, clue: "lövträd med vingfrön" }, 
{ number: 13, clue: "ormlik bokstav" }, 
{ number: 14, clue: "kroppsdel vid axeln" }, 
{ number: 6, clue: "något man helst inte missar" }, 
{ number: 7, clue: "lövträd med ekollon" }, 
{ number: 2, clue: "först i lund" }, 
],  
verticalClues: [
{ number: 2, clue: "spårhund i barn-tv" }, 
{ number: 3, clue: "sydligaste baltiska landet" }, 
{ number: 5, clue: "liten batteri" }, 
{ number: 6, clue: "för djupkylning" }, 
{ number: 7, clue: "håller maten kall" }, 
{ number: 10, clue: "rysk bemannad rymdfarkost" }, 
{ number: 11, clue: "första bokstaven i kung" }, 
{ number: 12, clue: "viktigt ljud i motorer" }, 
{ number: 14, clue: "dubbel-v enligt äldre namn" }, 
{ number: 8, clue: "vokalen mellan t och v" }, 
{ number: 17, clue: "tv utan tablå" }, 
{ number: 19, clue: "nordisk allfader" }, 
{ number: 20, clue: "tvåa bland bokstäverna" }, 
{ number: 22, clue: "sci-fi hjälte från Star Wars" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
