
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Tuesday, 2026-10-27</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Tuesday, 2026-10-27</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="clues">
    <h3>Horizotnal</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Vertical</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, null, null, null, "25", null, "22", null, null, ],
		[null, "16", "9", "g", "u", "b", "b", "e", "7", null, ],
		["10", "c", "o", "o", "l", "19", "k", "a", "p", null, ],
		[null, "5", "d", "a", "t", "a", "26", "2", "o", null, ],
		["8", "b", "i", "t", "3", "b", "u", "s", "e", null, ],
		[null, "e", "e", "13", "t", "e", "14", "s", null, null, ],
		["15", "n", "1", "s", "e", "l", "m", "a", null, null, ],
		["4", "j", "a", "y", "n", "e", "17", "b", null, null, ],
		["20", "i", "12", "o", "n", "y", "x", null, null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "första kvinnan med litteraturpriset" }, 
{ number: 4, clue: "sci-fi legosoldat i Firefly" }, 
{ number: 3, clue: "person som ger snutar arbete" }, 
{ number: 8, clue: "minsta informationsenhet" }, 
{ number: 10, clue: "något alla vill vara" }, 
{ number: 5, clue: "android i Star Trek" }, 
{ number: 12, clue: "planet i Halo" }, 
{ number: 13, clue: "varm dryck" }, 
{ number: 15, clue: "först i nej" }, 
{ number: 17, clue: "tvåa bland bokstäverna" }, 
{ number: 19, clue: "del av en bok" }, 
{ number: 20, clue: "ser ut som ett utrop med prick" }, 
{ number: 14, clue: "slingrig bokstav" }, 
{ number: 9, clue: "äldre man i vardagstal" }, 
{ number: 2, clue: "rund vokal" }, 
],  
verticalClues: [
{ number: 2, clue: "ståltillverkare från Sverige" }, 
{ number: 3, clue: "finns i lödtenn" }, 
{ number: 5, clue: "kringresande hjältehund" }, 
{ number: 7, clue: "sci-fi pilot från Star Wars" }, 
{ number: 9, clue: "garfields godtrogna kompis" }, 
{ number: 14, clue: "börjar ordet mat" }, 
{ number: 16, clue: "vanlig i engelsk stavning" }, 
{ number: 1, clue: "alfabetets etta" }, 
{ number: 22, clue: "stor spel förlag" }, 
{ number: 25, clue: "kommer efter a" }, 
{ number: 26, clue: "vokalen mellan t och v" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
